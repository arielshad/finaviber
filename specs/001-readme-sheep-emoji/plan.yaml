name: "readme-sheep-emoji"
summary: >
  Append the sheep emoji (🐑) to README.md on its own line at the end of the file,
  separated from existing content by a blank line, with a trailing newline. This is a
  direct file edit requiring no libraries, no build steps, and no code changes. The
  implementation uses the literal UTF-8 emoji character to match the existing README
  conventions.

