content: |
  ## Problem Statement

  The user wants a sheep emoji (🐑) appended to the bottom of the project's README.md file. The README currently ends after an "Additional Resources" section with links to documentation for Cloudflare Workers, Vite, React, and Hono. The file ends with a trailing blank line at line 84.

  ## Success Criteria

  - [ ] The sheep emoji (🐑) appears as the last visible content in README.md
  - [ ] All existing README.md content above the emoji is preserved byte-for-byte
  - [ ] The file remains valid Markdown after the change
  - [ ] The file ends with a trailing newline (POSIX convention)
  - [ ] The emoji is on its own line, separated from preceding content by a blank line

  ## Functional Requirements

  - **FR-1**: Append the Unicode sheep emoji character (🐑, U+1F411) to the end of README.md on its own line
  - **FR-2**: Preserve all existing content in README.md without modification — no lines added, removed, or changed above the insertion point
  - **FR-3**: Maintain a blank line between the last existing content (Additional Resources links) and the sheep emoji line

  ## Non-Functional Requirements

  - **NFR-1**: The file must end with a trailing newline character to comply with POSIX conventions and avoid git diff warnings
  - **NFR-2**: The file must remain valid Markdown — the emoji must not break any existing Markdown rendering
  - **NFR-3**: The change must be limited to README.md only — no other files in the repository should be modified (aside from spec files)

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Should the sheep emoji be on its own line or appended to the last existing line? | Own line | The user said "add to the bottom," implying a new line of content. Keeps existing content untouched. |
  | 2 | Should there be a trailing newline after the sheep emoji? | Yes | Follows POSIX conventions, avoids git diff warnings, consistent with existing file format. |
  | 3 | Should the emoji be separated from preceding content by a blank line? | Yes | Maintains visual consistency with the README's existing section spacing pattern. |

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | README.md | Low | Single line appended to the end of the file; no structural changes |

  ## Dependencies

  None. This change only touches README.md and has no dependencies on application code, libraries, or infrastructure.

  ## Size Estimate

  **S** — This is a single-line addition to a Markdown file. No code changes, no tests to update, no build impact. Can be completed in minutes.
