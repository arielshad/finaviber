content: |
  ## Problem Statement

  The finaviber application currently has no emoji support. The app is a minimal starter
  template (Vite + React + Hono + Cloudflare Workers) with a counter demo and a simple
  API call. Adding emoji support means introducing a way for users to browse, search,
  and select emojis and insert them into a text input — demonstrating a practical UI
  pattern that could serve as the foundation for a future messaging feature.

  ## Success Criteria

  - [ ] An emoji picker component is visible and functional in the app UI
  - [ ] Users can open and close the emoji picker via a toggle button
  - [ ] Users can browse emojis by category within the picker
  - [ ] Users can search for emojis by keyword within the picker
  - [ ] Selecting an emoji inserts its Unicode character into a textarea at the cursor position
  - [ ] The textarea displays both typed text and inserted emojis correctly
  - [ ] The emoji picker visually matches the app's dark/light theme (via prefers-color-scheme)
  - [ ] The feature does not break existing counter and API demo functionality
  - [ ] The app builds successfully with `npm run build` (TypeScript compilation + Vite bundling)
  - [ ] The app lints cleanly with `npm run lint`

  ## Functional Requirements

  - **FR-1**: The app SHALL display a new "Emoji" section in the main UI, below the existing counter and API demo cards, following the same `.card` layout pattern.
  - **FR-2**: The Emoji section SHALL contain a textarea for composing text and a button to toggle the emoji picker open/closed.
  - **FR-3**: When the emoji picker is open, it SHALL display the full set of Unicode emojis organized by categories (e.g., Smileys, People, Animals, Food, Activities, Travel, Objects, Symbols, Flags).
  - **FR-4**: The emoji picker SHALL provide a search input that filters emojis by keyword (e.g., typing "smile" shows smile-related emojis).
  - **FR-5**: When a user clicks/taps an emoji in the picker, the emoji's native Unicode character SHALL be inserted into the textarea at the current cursor position.
  - **FR-6**: After inserting an emoji, the textarea SHALL retain focus and the cursor SHALL be positioned immediately after the inserted emoji.
  - **FR-7**: The emoji picker toggle button SHALL visually indicate whether the picker is currently open or closed.
  - **FR-8**: The emoji picker SHALL be dismissable by clicking the toggle button again.
  - **FR-9**: The emoji picker SHALL support skin tone selection for applicable emojis.

  ## Non-Functional Requirements

  - **NFR-1**: **Performance** — The emoji picker SHALL load without a noticeable delay. Lazy-loading the picker component or its data is acceptable to keep the initial page load fast.
  - **NFR-2**: **Theming** — The emoji picker SHALL respect the user's system color scheme preference (`prefers-color-scheme`), rendering in dark mode or light mode accordingly, consistent with the existing app theming.
  - **NFR-3**: **Accessibility** — The emoji picker toggle button SHALL have an accessible label (aria-label). The textarea SHALL have a visible label or placeholder text describing its purpose.
  - **NFR-4**: **TypeScript** — All new code SHALL be fully typed with no `any` types. New components SHALL use proper React component typing.
  - **NFR-5**: **Bundle size** — The emoji picker dependency (emoji-mart) adds ~200KB to the bundle. This is acceptable for this feature scope but should use the standard emoji-mart data import pattern to enable tree-shaking where possible.
  - **NFR-6**: **Browser compatibility** — Emoji rendering relies on native Unicode support. The feature SHALL work on modern browsers (Chrome, Firefox, Safari, Edge — latest 2 versions) using native system emoji fonts.
  - **NFR-7**: **Code organization** — The emoji picker functionality SHALL be implemented in a separate component file(s) under `src/react-app/`, not inlined entirely within `App.tsx`, to maintain separation of concerns.
  - **NFR-8**: **No backend changes** — This feature SHALL be entirely frontend. No new API routes or backend dependencies.

  ## Product Questions & AI Recommendations

  | # | Question | AI Recommendation | Rationale |
  | - | -------- | ----------------- | --------- |
  | 1 | Use emoji picker library or build custom? | Use emoji-mart library | Mature, well-maintained, full emoji dataset with search/categories/skin tones. Pragmatic for S-sized feature. |
  | 2 | How to integrate into existing layout? | New card section below existing demos | Follows existing .card pattern, non-disruptive, no architectural changes needed. |
  | 3 | Support dark/light theme matching? | Yes, match system theme | App already respects prefers-color-scheme; emoji-mart supports theme='auto'. |
  | 4 | Add backend API for emoji data? | No backend changes | Emoji data is bundled client-side. No persistence needed for a demo feature. |
  | 5 | What text input mechanism? | Textarea with emoji insertion at cursor | Demonstrates practical usage, accessible by default, realistic UX pattern. |

  ## Codebase Analysis

  ### Project Structure

  ```
  /
  ├── src/
  │   ├── react-app/          # Frontend React application
  │   │   ├── App.tsx          # Main app component (counter + API demo)
  │   │   ├── App.css          # Component styles
  │   │   ├── main.tsx         # React entry point (createRoot)
  │   │   ├── index.css        # Global styles (dark/light theme)
  │   │   ├── vite-env.d.ts    # Vite type declarations
  │   │   └── assets/          # SVG logos (React, Vite, Hono, Cloudflare)
  │   └── worker/
  │       └── index.ts         # Hono API server (single GET /api/ route)
  ├── public/                  # Static assets (vite.svg)
  ├── index.html               # HTML entry point
  ├── vite.config.ts           # Vite + Cloudflare plugin config
  ├── wrangler.json            # Cloudflare Workers config
  ├── eslint.config.js         # ESLint with React hooks + refresh plugins
  ├── tsconfig.json            # Root TS config (references app, node, worker)
  ├── tsconfig.app.json        # React app TS config (strict, react-jsx)
  ├── tsconfig.worker.json     # Worker TS config
  └── package.json             # Dependencies and scripts
  ```

  ### Architecture Patterns

  - **Two-layer architecture**: React SPA frontend + Hono API backend, both deployed as a single Cloudflare Worker
  - **Vite bundling**: The Cloudflare Vite plugin handles both frontend bundling and worker compilation
  - **SPA routing**: Wrangler configured with `not_found_handling: "single-page-application"` for client-side routing
  - **Minimal component structure**: Single `App.tsx` component with no routing, state management library, or component hierarchy
  - **No component library**: Raw HTML elements with custom CSS — no UI framework (e.g., no Tailwind, no MUI)
  - **No testing setup**: No test framework, no test files

  ### Relevant Technologies

  - **React 19** with hooks (`useState`) — the emoji picker will be a React component
  - **TypeScript** in strict mode — all new code must be fully typed
  - **Hono 4.7** — not affected by this feature (frontend-only)
  - **Vite 6.3** — handles bundling; the emoji-mart dependency will be auto-bundled
  - **CSS** (plain) — styling uses vanilla CSS with CSS custom properties for theming

  ## Affected Areas

  | Area | Impact | Reasoning |
  | ---- | ------ | --------- |
  | `src/react-app/App.tsx` | Medium | Add the new emoji card section, import the new EmojiPicker component |
  | `src/react-app/App.css` | Medium | Styles for the emoji section layout, textarea, and toggle button |
  | `src/react-app/` (new components) | High | New EmojiPicker component file wrapping emoji-mart with app-specific logic |
  | `package.json` | Low | Add emoji-mart and @emoji-mart/data as dependencies |
  | `src/worker/index.ts` | None | No backend changes needed |

  ## Dependencies

  - **React 19** — component rendering and state management for the picker
  - **emoji-mart** — third-party emoji picker component providing the full emoji browsing, search, and selection UI
  - **@emoji-mart/data** — emoji dataset used by emoji-mart
  - **@emoji-mart/react** — React bindings for emoji-mart
  - **CSS** — existing global styles and theming (dark/light mode support in `index.css`) will be respected by the emoji picker via its theme prop

  ## Size Estimate

  **S** — The codebase is minimal (a starter template) with very few files. The feature involves:
  installing emoji-mart, creating 1 new component file for the emoji picker wrapper, adding a new
  card section to App.tsx with a textarea and toggle button, and adding corresponding styles.
  No backend work, no database, no routing changes, no complex state management.

